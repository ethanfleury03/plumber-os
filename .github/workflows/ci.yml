name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci-placeholder
      CLERK_SECRET_KEY: sk_test_ci-placeholder
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_ci_placeholder
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      APP_BASE_URL: http://localhost:3003
      NEXT_PUBLIC_APP_BASE_URL: http://localhost:3003
      NEXT_PUBLIC_APP_URL: http://localhost:3003
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_CLIENT_PORTAL_URL: http://localhost:3003/sign-in
      BLOG_API_TOKEN: ci-blog-token
      ALLOW_DATA_URL_BLOG_IMAGES: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Portal lint
        run: npm run lint --workspace @wnyautomation/portal

      - name: Portal typecheck
        run: npm run typecheck --workspace @wnyautomation/portal

      - name: Portal unit tests
        run: npm run test --workspace @wnyautomation/portal

      - name: Portal Drizzle schema check
        run: npm exec --workspace @wnyautomation/portal -- drizzle-kit check || echo "drizzle check not fatal yet"

      - name: Portal build
        run: npm run build --workspace @wnyautomation/portal

      - name: Marketing smoke test
        run: npm run test --workspace @wnyautomation/marketing

      - name: Marketing build
        run: npm run build --workspace @wnyautomation/marketing
